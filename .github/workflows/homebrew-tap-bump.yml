name: Bump Homebrew tap formula

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap (e.g. v0.2.61)"
        required: true
        type: string

permissions:
  contents: read

# Event text (tag names, dispatch inputs) and step outputs are never expanded
# into script source: they reach the shell and Python only through env and are
# validated against a strict version pattern first.
jobs:
  bump-formula:
    runs-on: ubuntu-latest
    # Holds HOMEBREW_TAP_TOKEN; configure required reviewers and a tag
    # deployment rule (v*) for this environment in the repository settings.
    environment: release
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${RELEASE_TAG}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y.Z."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Checkout noxtls (for the reviewed-source check)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          path: noxtls-src

      - name: Require the tag to be on the protected default branch
        id: source
        shell: bash
        working-directory: noxtls-src
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ ! "${DEFAULT_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unexpected default branch name."
            exit 1
          fi
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          git fetch --force --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "${TAG_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "Tag ${TAG} (${TAG_SHA}) is not reachable from origin/${DEFAULT_BRANCH}."
            exit 1
          fi
          echo "sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Fetch source tarball checksum
        id: tarball
        shell: bash
        working-directory: noxtls-src
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          TAG_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          URL="https://github.com/argenox/noxtls/archive/refs/tags/${TAG}.tar.gz"
          curl -fsSL -o /tmp/noxtls-src.tar.gz "${URL}"
          # The tag must not have moved between the ancestry check and the download.
          git fetch --force --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          NOW_SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [[ "${NOW_SHA}" != "${TAG_SHA}" ]]; then
            echo "Tag ${TAG} moved during the run."
            exit 1
          fi
          SHA256="$(sha256sum /tmp/noxtls-src.tar.gz | awk '{print $1}')"
          echo "url=${URL}" >> "${GITHUB_OUTPUT}"
          echo "sha256=${SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: argenox/homebrew-noxtls
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false
          path: homebrew-noxtls

      - name: Update Formula/noxtls.rb
        shell: bash
        env:
          FORMULA: homebrew-noxtls/Formula/noxtls.rb
          VERSION: ${{ steps.tag.outputs.version }}
          URL: ${{ steps.tarball.outputs.url }}
          SHA256: ${{ steps.tarball.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ ! -f "${FORMULA}" ]]; then
            echo "Missing ${FORMULA}"
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["FORMULA"])
          url = os.environ["URL"]
          sha256 = os.environ["SHA256"]
          version = os.environ["VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("bad version")
          if not re.fullmatch(r"[0-9a-f]{64}", sha256):
              raise SystemExit("bad sha256")
          if not re.fullmatch(r"https://github\.com/argenox/noxtls/archive/refs/tags/v[0-9.]+\.tar\.gz", url):
              raise SystemExit("bad url")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'(\surl\s+")[^"]+(")', lambda m: m.group(1) + url + m.group(2), text, count=1)
          text = re.sub(r'(\ssha256\s+")[^"]+(")', lambda m: m.group(1) + sha256 + m.group(2), text, count=1)
          text = re.sub(
              r'(# noxtls formula version:\s*)\S+',
              lambda m: m.group(1) + version,
              text,
              count=1,
          )
          # Prefer letting Homebrew infer version from the tag tarball URL.
          text = re.sub(r'\n\s*version\s+"[^"]+"\s*\n', '\n', text, count=1)
          path.write_text(text, encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Commit and push
        working-directory: homebrew-noxtls
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/noxtls.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "noxtls ${VERSION}"
          # The token is used for this push only; it is not stored in git config.
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          AUTH="$(printf 'x-access-token:%s' "${TAP_TOKEN}" | base64 -w0)"
          echo "::add-mask::${AUTH}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push origin "HEAD:refs/heads/${BRANCH}"
