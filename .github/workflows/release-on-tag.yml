name: Release on tag

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g., v0.1.22)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    outputs:
      noxtls_version: ${{ steps.verify.outputs.noxtls_version }}
      release_tag: ${{ steps.verify.outputs.release_tag }}
      release_sha: ${{ steps.verify.outputs.release_sha }}
    steps:
      - name: Check tag name
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z."
            exit 1
          fi
          if [[ ! "${DEFAULT_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Unexpected default branch name."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Verify tag version and branch ancestry
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${RELEASE_TAG}"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${TAG_NAME}^{commit}")"
          HEAD_SHA="$(git rev-parse --verify HEAD)"
          if [[ "${TAG_SHA}" != "${HEAD_SHA}" ]]; then
            echo "Checked-out tree is not the tagged commit."
            exit 1
          fi

          # Reviewed-source gate: the tagged commit must be reachable from the
          # protected default branch, fetched by its exact ref (a branch merely
          # named like origin/main elsewhere in the ref list cannot satisfy this).
          git fetch --force --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "${TAG_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "Tagged commit ${TAG_SHA} is not on origin/${DEFAULT_BRANCH}."
            exit 1
          fi

          HEADER_VERSION="$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          header = pathlib.Path("noxtls_version.h").read_text(encoding="utf-8")
          m = re.search(r'NOXTLS_VERSION_STRING\s+"([0-9]+\.[0-9]+\.[0-9]+)"', header)
          if not m:
              sys.exit("Could not find a vX.Y.Z NOXTLS_VERSION_STRING")
          print(m.group(1))
          PY
          )"

          TAG_VERSION="${TAG_NAME#v}"
          if [[ "${TAG_VERSION}" != "${HEADER_VERSION}" ]]; then
            echo "Tag ${TAG_NAME} does not match NOXTLS_VERSION_STRING ${HEADER_VERSION}"
            exit 1
          fi

          echo "noxtls_version=${HEADER_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          # Later jobs build this exact commit, not the (mutable) tag name.
          echo "release_sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"

  build-release-assets:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
            use_msys2: false
            archive_ext: tar.gz
          - os: macos-latest
            artifact_suffix: macos-x64
            use_msys2: false
            archive_ext: tar.gz
          - os: windows-latest
            artifact_suffix: windows-x64
            use_msys2: true
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup MSYS2 (Windows MinGW)
        if: ${{ matrix.use_msys2 }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure and build (Linux/macOS)
        if: ${{ !matrix.use_msys2 }}
        shell: bash
        run: |
          set -euo pipefail
          create_legacy_aliases() {
            local compat_dir="$1"
            for mapping in \
              "aes:noxtls-aes" \
              "base64:noxtls-base64" \
              "cert:noxtls-cert" \
              "dtls_psk_test:noxtls-dtls_psk_test" \
              "prime:noxtls-prime" \
              "sha:noxtls-sha" \
              "tls_test:noxtls-tls_test"; do
              local legacy_name="${mapping%%:*}"
              local current_name="${mapping##*:}"
              if [[ -f "${compat_dir}/${legacy_name}" ]]; then
                continue
              fi
              if [[ -f "${compat_dir}/${current_name}" ]]; then
                cp -a "${compat_dir}/${current_name}" "${compat_dir}/${legacy_name}"
              elif [[ -f "${compat_dir}/${current_name}.exe" ]]; then
                cp -a "${compat_dir}/${current_name}.exe" "${compat_dir}/${legacy_name}"
              elif [[ -f "${compat_dir}/${legacy_name}.exe" ]]; then
                cp -a "${compat_dir}/${legacy_name}.exe" "${compat_dir}/${legacy_name}"
              fi
            done
          }
          INSTALL_PREFIX="$(pwd)/artifacts/sdk-prefix"
          cmake -S . -B build -G Ninja \
            -D BUILD_SHARED_LIBS=OFF \
            -D BUILD_TESTS=OFF \
            -D BUILD_APPLICATIONS=ON \
            -D BUILD_BOGO_SHIM=OFF \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}"
          cmake --build build --parallel
          cmake --install build
          # Library SDK archive: libs, headers, CMake package, pkg-config (no CLIs).
          mkdir -p artifacts/static-sdk
          cp -a "${INSTALL_PREFIX}/lib" "${INSTALL_PREFIX}/include" artifacts/static-sdk/
          # Applications archive contents.
          mkdir -p artifacts/applications
          cp -a "${INSTALL_PREFIX}/bin/." artifacts/applications/
          # Backward-compatible layout for consumers that still validate
          # binary/<legacy-name> inside application archives.
          mkdir -p artifacts/applications/binary
          cp -a "${INSTALL_PREFIX}/bin/." artifacts/applications/binary/
          create_legacy_aliases "artifacts/applications/binary"
          # Backward-compatible macOS layout for consumers that still validate
          # binary-<arch>/<legacy-name> paths inside application archives.
          if [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            # Keep legacy validators green: provide both binary-arm64 and
            # binary-x86_64 layouts with old executable names.
            for arch in arm64 x86_64; do
              compat_dir="artifacts/applications/binary-${arch}"
              mkdir -p "${compat_dir}"
              cp -a "artifacts/applications/binary/." "${compat_dir}/"
              create_legacy_aliases "${compat_dir}"
            done
          fi

      - name: Configure and build (Windows MinGW)
        if: ${{ matrix.use_msys2 }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          create_legacy_aliases() {
            local compat_dir="$1"
            for mapping in \
              "aes:noxtls-aes" \
              "base64:noxtls-base64" \
              "cert:noxtls-cert" \
              "dtls_psk_test:noxtls-dtls_psk_test" \
              "prime:noxtls-prime" \
              "sha:noxtls-sha" \
              "tls_test:noxtls-tls_test"; do
              local legacy_name="${mapping%%:*}"
              local current_name="${mapping##*:}"
              if [[ -f "${compat_dir}/${legacy_name}.exe" ]]; then
                continue
              fi
              if [[ -f "${compat_dir}/${current_name}.exe" ]]; then
                cp -a "${compat_dir}/${current_name}.exe" "${compat_dir}/${legacy_name}.exe"
              elif [[ -f "${compat_dir}/${current_name}" ]]; then
                cp -a "${compat_dir}/${current_name}" "${compat_dir}/${legacy_name}.exe"
              elif [[ -f "${compat_dir}/${legacy_name}" ]]; then
                cp -a "${compat_dir}/${legacy_name}" "${compat_dir}/${legacy_name}.exe"
              fi
            done
          }
          INSTALL_PREFIX="$(pwd)/artifacts/sdk-prefix"
          cmake -S . -B build -G Ninja \
            -D BUILD_SHARED_LIBS=OFF \
            -D BUILD_TESTS=OFF \
            -D BUILD_APPLICATIONS=ON \
            -D BUILD_BOGO_SHIM=OFF \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_INSTALL_PREFIX="${INSTALL_PREFIX}"
          cmake --build build --parallel
          cmake --install build
          mkdir -p artifacts/static-sdk
          cp -a "${INSTALL_PREFIX}/lib" "${INSTALL_PREFIX}/include" artifacts/static-sdk/
          mkdir -p artifacts/applications
          cp -a "${INSTALL_PREFIX}/bin/." artifacts/applications/
          mkdir -p artifacts/applications/binary
          cp -a "${INSTALL_PREFIX}/bin/." artifacts/applications/binary/
          create_legacy_aliases "artifacts/applications/binary"

      - name: Create release archives (Linux/macOS)
        if: ${{ !matrix.use_msys2 }}
        shell: bash
        env:
          VERSION: ${{ needs.validate-tag.outputs.noxtls_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -C artifacts/applications -czf "release-assets/noxtls-applications-${{ matrix.artifact_suffix }}-v${VERSION}.tar.gz" .
          tar -C artifacts/static-sdk -czf "release-assets/noxtls-static-library-${{ matrix.artifact_suffix }}-v${VERSION}.tar.gz" .

      - name: Create release archives (Windows)
        if: ${{ matrix.use_msys2 }}
        shell: powershell
        env:
          VERSION: ${{ needs.validate-tag.outputs.noxtls_version }}
        run: |
          $version = $env:VERSION
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Compress-Archive -Path "artifacts\applications\*" -DestinationPath "release-assets\noxtls-applications-${{ matrix.artifact_suffix }}-v$version.zip" -Force
          Compress-Archive -Path "artifacts\static-sdk\*" -DestinationPath "release-assets\noxtls-static-library-${{ matrix.artifact_suffix }}-v$version.zip" -Force

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact_suffix }}
          path: release-assets/*
          if-no-files-found: error

  package-esp32-applications:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-tag.outputs.release_sha }}
          persist-credentials: false

      - name: Package ESP32 applications
        shell: bash
        env:
          VERSION: ${{ needs.validate-tag.outputs.noxtls_version }}
        run: |
          chmod +x .github/scripts/package_esp32_applications.sh
          .github/scripts/package_esp32_applications.sh \
            . \
            release-assets \
            "${VERSION}"

      - name: Upload ESP32 applications release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-esp32-applications
          path: release-assets/noxtls-esp32-applications-*.zip
          if-no-files-found: error

  publish-release:
    needs: [validate-tag, build-release-assets, package-esp32-applications]
    runs-on: ubuntu-latest
    # Configure required reviewers and a tag deployment rule (v*) for this
    # environment in the repository settings.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Verify the tag still points at the validated commit
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.release_tag }}
          RELEASE_SHA: ${{ needs.validate-tag.outputs.release_sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          REFS="$(git ls-remote "${REPO_URL}" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          # Annotated tags list the peeled commit as ^{}; lightweight tags only the ref.
          NOW_SHA="$(printf '%s\n' "${REFS}" | awk '$2 ~ /\^\{\}$/ {print $1}')"
          if [[ -z "${NOW_SHA}" ]]; then
            NOW_SHA="$(printf '%s\n' "${REFS}" | awk '{print $1}' | head -n 1)"
          fi
          if [[ "${NOW_SHA}" != "${RELEASE_SHA}" ]]; then
            echo "Tag ${RELEASE_TAG} moved from ${RELEASE_SHA} to ${NOW_SHA:-<missing>}; refusing to publish."
            exit 1
          fi

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.release_tag }}
          name: NoxTLS ${{ needs.validate-tag.outputs.release_tag }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          # Never replace assets already published on an existing release.
          overwrite_files: false
