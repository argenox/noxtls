# Build a documentation preview on demand. It never deploys: the built site is
# uploaded as a workflow artifact ("docs-preview") to download and open locally.
# Production deploy remains deploy-docs.yml (push to main/master only), the only
# workflow that holds pages: write / id-token: write or uses the github-pages
# environment, so an arbitrary branch or tag can no longer replace the live site.

name: Docs Preview (Manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to preview (e.g. feat/docs-0.2.1)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The previewed tree is unreviewed and runs npm install: read-only token only.
permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Create Doxygen output directory
        run: mkdir -p build/doxygen

      - name: Run Doxygen (XML)
        run: doxygen Doxyfile

      - name: Convert Doxygen XML to Markdown
        run: node scripts/doxygen-xml-to-md.js build/doxygen/xml docs/docs/api

      - name: Verify API docs were generated
        run: |
          grep -q '## API' docs/docs/api/common.md
          test -f docs/docs/return-codes.md

      - name: Install and build Docusaurus
        working-directory: docs
        run: |
          npm install
          npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/build
          if-no-files-found: error
          retention-days: 7
