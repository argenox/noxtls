# Build and deploy documentation preview on-demand (does not update production).
# Production deploy remains deploy-docs.yml (push to main/master only).
#
# After the workflow runs, open the "github-pages" deployment URL on the PR checks,
# or use the comment posted on the PR. Add /docs/intro for the docs home with sidebar.

name: Docs Preview (Manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to preview (e.g. feat/docs-0.2.1)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-preview-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Create Doxygen output directory
        run: mkdir -p build/doxygen

      - name: Run Doxygen (XML)
        run: doxygen Doxyfile

      - name: Convert Doxygen XML to Markdown
        run: node scripts/doxygen-xml-to-md.js build/doxygen/xml docs/docs/api

      - name: Verify API docs were generated
        run: |
          grep -q '## API' docs/docs/api/common.md
          test -f docs/docs/return-codes.md

      - name: Install and build Docusaurus
        working-directory: docs
        run: |
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print preview URL
        run: |
          echo "Preview URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Docs intro:  ${{ steps.deployment.outputs.page_url }}docs/intro"
