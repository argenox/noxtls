name: Host tests, small handshake workspace

# Runs the host test suite with a handshake workspace smaller than the 4096 bytes the
# TLS 1.3 hello builders used to assume (NOXTLS-SA-0.3.15-16). Embedded builds such as the
# NoxThread nodes use 2048 bytes; the default 8192-byte build does not exercise these paths.
# The loopback tests' allocator checks a tail canary on every block, so an out-of-bounds
# write past a heap-allocated workspace fails the run.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-small-workspace:
    name: Host ctest (handshake workspace ${{ matrix.workspace }} B)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        workspace: [2048]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build openssl python3

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON -DBUILD_APPLICATIONS=ON \
            -DNOXTLS_BUILD_REGRESSION_TESTS=ON -DNOXTLS_BUILD_DTLS13_RECOVERY_TESTS=ON \
            -DNOXTLS_BUILD_TLS13_PEER_CERT_TESTS=ON \
            "-DCMAKE_C_FLAGS=-DNOXTLS_TLS_HANDSHAKE_WORKSPACE_SIZE=${{ matrix.workspace }}"
          cmake --build build -j "$(nproc)"

      - name: Run the test suite
        run: ctest --test-dir build -j "$(nproc)" --timeout 900 --output-on-failure
